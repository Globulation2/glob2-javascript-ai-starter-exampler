name: Release single-file AI
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run types && npm run build && node scripts/check-api.mjs
      - run: gh release create "$GITHUB_REF_NAME" dist/example.js --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
