name: Check example
on: [push, pull_request]
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: npm run build
      - run: npm test
      - run: node scripts/check-api.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: javascript-ai-example
          path: dist/example.js
